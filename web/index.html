const ui={
fr:{tag:"La documentation communautaire, de la découverte à l'administration",nav:["Accueil","Commencer ici","Fichiers et priorités","Sections INI","Performances","Archives OAR / IAR","Scripts LSL / OSSL","Dictionnaire INI","Sources et limites"],hero:"Apprendre à configurer OpenSimulator",intro:"Un guide pratique bilingue : comprendre les fichiers INI, diagnostiquer les performances, gérer les archives et découvrir la programmation. Les explications d'abord, les paramètres techniques ensuite.",start:"Par où commencer ?",search:"Chercher un paramètre ou une section…",all:"Toutes les sections",result:"paramètres trouvés",none:"Aucun résultat. Essayez un nom de section ou de paramètre différent.",more:"Afficher davantage",missing:"Le catalogue INI.CSV n'a pas pu être chargé. Vérifiez que le fichier est présent à la racine du site et que la page est servie en HTTP(S).",technical:"Description technique (source anglaise)",default:"Valeur relevée",source:"Références dans le code",ini:"Fichiers INI",section:"Section",type:"Type",about:"Documentation communautaire non officielle. Vérifiez toujours votre version d'OpenSimulator avant une modification. Ne publiez jamais vos secrets.",up:"Haut de page"},
en:{tag:"Community documentation, from first steps to administration",nav:["Home","Getting started","Files & precedence","INI sections","Performance","OAR / IAR archives","LSL / OSSL scripts","INI dictionary","Sources & limitations"],hero:"Learn to configure OpenSimulator",intro:"A bilingual practical guide: understand INI files, troubleshoot performance, manage archives and learn scripting. Explanations first, technical settings second.",start:"Where to begin?",search:"Find a setting or section…",all:"All sections",result:"settings found",none:"No results. Try another section or setting name.",more:"Show more",missing:"INI.CSV could not be loaded. Ensure the file exists at the website root and the page is served over HTTP(S).",technical:"Technical description (English source)",default:"Recorded value",source:"Source code references",ini:"INI file references",section:"Section",type:"Type",about:"Unofficial community documentation. Always check your OpenSimulator version before changing settings. Never publish secrets.",up:"Back to top"}};
const guides=[
{slug:"home",items:[]},
{slug:"basics",items:[
{title:["What is an INI file?","Qu’est-ce qu’un fichier INI ?"],body:["An INI file is a text file that stores named settings. Sections group related settings. A semicolon introduces a comment; commented-out settings are not applied from that line.","Un fichier INI est un fichier texte contenant des paramètres. Les sections regroupent les réglages. Un point-virgule introduit un commentaire ; une ligne commentée ne définit pas de valeur active."],code:"[Startup]\n; Commented out: not active\n; physics = BulletSim\nphysics = ubODE"},
{title:["What is a default value?","Qu’est-ce qu’une valeur par défaut ?"],body:["A value may come from program code, OpenSimDefaults.ini, or an override loaded later. The dictionary lists defaults and sample values, not your actual grid settings.","Une valeur peut provenir du code, de OpenSimDefaults.ini ou d’un fichier de surcharge chargé ensuite. Le dictionnaire décrit les valeurs de référence, pas les réglages réels de votre grille."],note:["In the simulator console, use config show to inspect the merged active settings.","Dans la console du simulateur, utilisez config show pour examiner les paramètres actifs après fusion."],code:"config show"},
{title:["Safe editing checklist","Modifier sans risque"],body:["Back up the file first. Change one parameter at a time, record its previous value, determine whether a restart is needed and inspect the startup logs. Never copy passwords, database credentials or tokens into public examples.","Sauvegardez d’abord le fichier. Modifiez un paramètre à la fois, conservez l’ancienne valeur, vérifiez si un redémarrage est requis et consultez les journaux. Ne publiez jamais de mots de passe, identifiants SQL ou jetons."]}]},
{slug:"files",items:[
{title:["OpenSimDefaults.ini and OpenSim.ini","OpenSimDefaults.ini et OpenSim.ini"],body:["OpenSimDefaults.ini defines many shipped defaults. OpenSim.ini customizes them for a simulator. OpenSim.ini.example is a template: copy it as OpenSim.ini for it to be loaded.","OpenSimDefaults.ini définit de nombreuses valeurs de base. OpenSim.ini les personnalise pour le simulateur. OpenSim.ini.example est un modèle : il doit être copié sous le nom OpenSim.ini pour être chargé."],code:"; Example: in OpenSim.ini\n[Startup]\nphysics = ubODE"},
{title:["Architecture and config-include","Architecture et config-include"],body:["The selected architecture points to additional configuration, commonly StandaloneCommon.ini or GridCommon.ini. Those files define service connectors; choose the model that matches your installation.","L’architecture sélectionnée fait intervenir des fichiers supplémentaires, généralement StandaloneCommon.ini ou GridCommon.ini. Ils définissent les connecteurs de services ; choisissez le modèle adapté à votre installation."],note:["Do not confuse a standalone simulator with a region connected to external ROBUST services.","Ne confondez pas un simulateur autonome avec une région connectée à des services ROBUST externes."]},
{title:["Personal overrides: bin/config/","Surcharges personnelles : bin/config/"],body:["A simulator may load extra *.ini files from its configured INI directory (often bin/config/). Their priority depends on the actual loading sequence; verify the final value using config show. Do not assume a folder name alone guarantees precedence.","Un simulateur peut charger des fichiers *.ini supplémentaires depuis son dossier configuré (souvent bin/config/). Leur priorité dépend de l’ordre de chargement réel ; vérifiez avec config show. Le seul nom du dossier ne garantit pas la priorité."],code:"; Example of a personal override\n; bin/config/local-physics.ini\n[Startup]\nphysics = ubODE"},
{title:["ROBUST uses its own configuration","ROBUST possède sa propre configuration"],body:["ROBUST is configured separately, commonly using Robust.ini or Robust.HG.ini and a modular config directory. Do not automatically apply the simulator's INI precedence model to ROBUST.","ROBUST utilise une configuration distincte, souvent Robust.ini ou Robust.HG.ini et un dossier de configuration modulaire. N’appliquez pas automatiquement à ROBUST les règles de chargement des simulateurs."]}]},
{slug:"sections",items:[
{title:["[Startup] — simulator startup","[Startup] — démarrage du simulateur"],body:["Controls a set of initialization choices, console behavior and, depending on build, physics selection. Changing a startup setting may require restarting the simulator.","Regroupe des choix d’initialisation, des réglages de console et, selon la version, la sélection de la physique. Une modification peut nécessiter un redémarrage."],code:"[Startup]\nphysics = ubODE"},
{title:["[Const] — reusable constants","[Const] — constantes réutilisables"],body:["Defines values reused elsewhere, such as hostnames or URLs. Replace example hosts with your actual values and keep internal endpoints protected.","Définit des valeurs réutilisables, comme des noms de domaine ou URL. Remplacez les exemples par vos valeurs et protégez les points d’accès internes."],code:"[Const]\nBaseHostname = \"127.0.0.1\"\nBaseURL = \"http://${Const|BaseHostname}\""},
{title:["[Architecture] — deployment mode","[Architecture] — mode de déploiement"],body:["Selects which additional architecture configuration is loaded. A standalone instance and a grid region need different service definitions.","Détermine la configuration d’architecture complémentaire chargée. Une instance autonome et une région de grille utilisent des définitions de services différentes."]},
{title:["Service and storage sections","Sections des services et du stockage"],body:["Database, asset, inventory and grid-related sections depend on the selected architecture and modules. Use the dictionary to find exact names and the source file that reads each key.","Les sections de base de données, d’assets, d’inventaire et de services dépendent de l’architecture et des modules. Le dictionnaire permet de retrouver le nom précis et le fichier source qui lit chaque paramètre."]}]},
{slug:"performance",items:[
{title:["Diagnose before changing parameters","Diagnostiquer avant de modifier"],body:["Start with measurable symptoms: high simulator frame time, script delays, slow teleports, network latency, memory growth, or physics lag. Check the simulator logs and console statistics, then compare the same region under similar loads.","Commencez par des symptômes mesurables : temps de frame élevé, scripts lents, téléportations longues, latence réseau, mémoire croissante ou physique lente. Consultez les journaux et statistiques de console, puis comparez à charge équivalente."],note:["There is no universally optimal setting. Performance depends on version, scripts, geometry, traffic, physics engine and host resources.","Il n’existe aucun réglage universellement optimal. Les performances dépendent de la version, des scripts, de la géométrie, du trafic, de la physique et des ressources serveur."]},
{title:["CPU, memory and disk","CPU, mémoire et disque"],body:["Observe process-level CPU and RAM rather than only host totals. Look for excessive swapping, slow storage or very large caches. A large memory footprint alone does not prove a leak.","Mesurez CPU et RAM par processus, pas seulement au niveau du serveur. Recherchez le swap excessif, les disques lents ou les caches importants. Une consommation mémoire élevée ne prouve pas à elle seule une fuite."],code:"top\nvmstat 1 10\nfree -h"},
{title:["Physics and meshing","Physique et maillage"],body:["Compare supported physics engines on a test region before deployment. Collision-heavy or complex meshes may increase CPU load. Prefer appropriate physics shapes for static decoration and measure the result.","Comparez les moteurs physiques pris en charge sur une région de test avant déploiement. Les collisions et maillages complexes peuvent accroître la charge CPU. Utilisez des formes physiques adaptées aux objets décoratifs statiques, puis mesurez l’effet."]},
{title:["Scripts, timers and sensors","Scripts, temporisateurs et capteurs"],body:["Profile high-frequency timers, frequent scans and expensive loops. Reduce needless work and benchmark with representative objects and avatars. Avoid changing global limits to hide a poorly optimized script.","Analysez les timers trop fréquents, scans répétitifs et boucles coûteuses. Réduisez le travail inutile et testez avec des objets et avatars représentatifs. Évitez de modifier les limites globales pour masquer un script mal optimisé."]},
{title:["Networking and services","Réseau et services"],body:["Slow teleports or asset loads can involve DNS, databases, asset storage, cross-region communication or service latency. Trace the bottleneck before attributing it to physics or scripts.","Les téléportations et chargements d’assets lents peuvent impliquer le DNS, MySQL, le stockage, la communication inter-régions ou les services. Localisez le goulot avant d’accuser la physique ou les scripts."]}]},
{slug:"archives",items:[
{title:["OAR — save or restore a region","OAR — sauvegarder ou restaurer une région"],body:["An OAR is a region archive: objects, terrain and other region content according to archive options. Run the command from the simulator console with the appropriate region selected. Test the restoration on a disposable test region.","Un OAR archive une région : objets, terrain et autres contenus selon les options. Exécutez la commande depuis la console du simulateur avec la bonne région sélectionnée. Testez la restauration sur une région de test."],code:"save oar /backups/region.oar\nload oar /backups/region.oar",note:["Loading an OAR may replace existing region content. Back up before restoring, and review permissions and asset availability.","Charger un OAR peut remplacer le contenu existant. Sauvegardez avant toute restauration et vérifiez permissions et assets."]},
{title:["IAR — inventory backup","IAR — sauvegarde d'inventaire"],body:["An IAR stores an avatar's inventory tree. The command uses avatar first name, last name, inventory path, account password and output path. Avoid placing real passwords in shared commands or screenshots.","Un IAR sauvegarde l’arborescence d’inventaire d’un avatar. La commande utilise prénom, nom, chemin d’inventaire, mot de passe du compte et chemin de sortie. Ne diffusez pas de vrais mots de passe."],code:'save iar First Last "/" PASSWORD /backups/inventory.iar\nload iar First Last "/" PASSWORD /backups/inventory.iar',note:["Syntax and available flags can vary by release. Check console help before running options such as --noassets, --merge or --skip-assets.","La syntaxe et les options varient selon les versions. Vérifiez l’aide de la console avant d’utiliser des options comme --noassets, --merge ou --skip-assets."]},
{title:["Archive strategy","Stratégie de sauvegarde"],body:["Use versioned filenames and retention policies. Keep backups on a separate disk or host, test restores periodically and document whether asset data is included.","Utilisez des noms datés et des règles de rétention. Stockez des copies sur un autre disque ou hôte, testez les restaurations et indiquez si les données d’assets sont incluses."]}]},
{slug:"scripts",items:[
{title:["LSL and OSSL: what is the difference?","LSL et OSSL : quelles différences ?"],body:["LSL is the familiar in-world scripting language. OSSL adds OpenSimulator-specific functions, commonly prefixed os. The availability of each OSSL function depends on the simulator version and the administrator's permissions.","LSL est le langage de script classique des objets. OSSL ajoute des fonctions propres à OpenSimulator, généralement préfixées os. Leur disponibilité dépend de la version et des autorisations définies par l’administrateur."],code:'default\n{\n    state_entry()\n    {\n        llOwnerSay("Hello OpenSimulator!");\n    }\n}'},
{title:["OSSL permissions and risk","Autorisations OSSL et risques"],body:["Some OSSL functions access powerful simulator capabilities. Administrators should configure explicit function permissions and appropriate threat restrictions rather than enabling everything. Code that works on one grid may fail on another.","Certaines fonctions OSSL accèdent à des capacités puissantes du simulateur. Les administrateurs doivent définir des autorisations explicites et des restrictions adaptées, plutôt que tout autoriser. Un script peut fonctionner sur une grille et être refusé sur une autre."],note:["Never copy a permissive OSSL example to a public region without reviewing its security implications.","Ne copiez jamais une configuration OSSL permissive sur une région publique sans évaluer les conséquences de sécurité."]},
{title:["Learn the script API from the source","Explorer les fonctions dans le code"],body:["The OpenSimulator source implements LSL and OSSL APIs. For a reliable function reference, check signature, arguments, return value, documented limitations and permissions against the exact release.","Les sources OpenSimulator implémentent les API LSL et OSSL. Pour documenter correctement une fonction, contrôlez signature, paramètres, retour, limites et permissions sur la version concernée."]},
{title:["Good scripting practices","Bonnes pratiques de scripting"],body:["Prefer event-driven code, meaningful timer intervals, limited sensors and predictable memory use. Measure before and after changes, and test failure cases rather than just successful calls.","Privilégiez les événements, des intervalles de timer raisonnables, des capteurs limités et une utilisation prévisible de la mémoire. Mesurez avant/après et testez aussi les cas d’échec."]}]},
{slug:"dictionary",items:[]},
{slug:"sources",items:[
{title:["Primary sources and attribution","Sources principales et attribution"],body:["The official OpenSimulator wiki and your OpenSimulator source fork are the primary references. The configuration dataset comes from the Opensim-Variables catalog. Links below point to original documentation; this is not an official wiki replacement.","Le wiki officiel et le code source de votre fork OpenSimulator sont les références principales. Les données de paramètres proviennent du catalogue Opensim-Variables. Les liens ci-dessous renvoient aux originaux ; ce site n'est pas un remplacement officiel du wiki."],links:[["OpenSimulator Wiki","https://opensimulator.org/wiki/Main_Page"],["Performance","https://opensimulator.org/wiki/Performance"],["OpenSim Archives (FR)","https://opensimulator.org/wiki/OpenSim_Archives/fr"],["Inventory Archives","https://opensimulator.org/wiki/Inventory_Archives"],["OSSL","https://opensimulator.org/wiki/OSSL_Implemented"],["OpenSimulator source","https://github.com/Vlad-BloodMoon/opensim"],["INI catalog","https://github.com/Vlad-BloodMoon/Opensim-Variables"]]},
{title:["Scope and accuracy","Périmètre et fiabilité"],body:["This first publication is a verified navigation and learning foundation, not a complete function-by-function scripting manual yet. The catalog's inferred descriptions are shown as original English technical text. Configuration syntax and behavior may vary across releases and modules.","Cette première publication constitue un socle de navigation et d'apprentissage, pas encore un manuel exhaustif de toutes les fonctions de script. Les descriptions déduites du code restent affichées dans leur anglais technique d’origine. La syntaxe et le comportement peuvent varier selon la version et les modules."]}]}
];
const names=guides.map(g=>g.slug);let lang=(localStorage.getItem("oslang")==="en"?"en":"fr"),current=(location.hash.slice(1).split("?")[0]||"home");if(!names.includes(current))current="home";let dataset=[],filtered=[],shown=40,loaded=false;
function pick(pair){return pair[lang==="fr"?1:0]}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function article(item){return '<article class="article"><h3>'+escapeHtml(pick(item.title))+'</h3><p>'+escapeHtml(pick(item.body))+'</p>'+(item.code?'<pre><code>'+escapeHtml(item.code)+'</code></pre>':'')+(item.note?'<div class="tip">'+escapeHtml(pick(item.note))+'</div>':'')+(item.links?'<div class="sources">'+item.links.map(([name,url])=>'<p><a href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(name)+'</a></p>').join('')+'</div>':'')+'</article>'}
function navigate(slug){current=slug;location.hash=slug;render();window.scrollTo({top:0,behavior:"instant"})}
function render(){const t=ui[lang];document.documentElement.lang=lang;document.title="OpenSimulator Handbook | "+t.nav[names.indexOf(current)];document.getElementById("tagline").textContent=t.tag;document.getElementById("fr").classList.toggle("active",lang==="fr");document.getElementById("en").classList.toggle("active",lang==="en");document.getElementById("nav").innerHTML=names.map((s,i)=>'<button class="'+(s===current?"current":"")+'" data-go="'+s+'">'+escapeHtml(t.nav[i])+'</button>').join("");const root=document.getElementById("content");
if(current==="home"){root.innerHTML='<div class="hero"><div class="eyebrow">OpenSimulator • FR / EN</div><h1>'+t.hero+'</h1><p>'+t.intro+'</p><span class="pill">INI • OAR • IAR • LSL • OSSL</span></div><h2>'+t.start+'</h2><div class="grid">'+names.slice(1,8).map(s=>{const i=names.indexOf(s);return '<button class="card go" data-go="'+s+'"><h3>'+escapeHtml(t.nav[i])+'</h3><p>'+escapeHtml(lang==="fr"?"Ouvrir le chapitre et découvrir des exemples commentés.":"Open the chapter and explore annotated examples.")+'</p></button>'}).join("")+'</div>'}
else if(current==="dictionary"){root.innerHTML='<h2>'+t.nav[7]+'</h2><p class="muted">'+(lang==="fr"?"Catalogue consultable avec valeurs, descriptions techniques et références au code source. Les descriptions anglaises sont conservées pour éviter une traduction automatique trompeuse.":"Searchable catalog with values, original descriptions and source references.")+'</p><div class="search"><input id="query" type="search" placeholder="'+escapeHtml(t.search)+'" aria-label="'+escapeHtml(t.search)+'"><select id="sectionFilter" aria-label="Section"><option value="">'+escapeHtml(t.all)+'</option></select></div><div id="count" class="metadata"></div><div id="results"></div><button id="more" class="more" hidden>'+t.more+'</button>';prepareSearch()}
else{const g=guides.find(g=>g.slug===current);root.innerHTML='<h2>'+escapeHtml(t.nav[names.indexOf(current)])+'</h2>'+g.items.map(article).join('')}
document.getElementById("footer").textContent=t.about;document.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>navigate(el.dataset.go)))}
function parseCSV(csv){const rows=[];let fields=[],val="",quoted=false;for(let i=0;i<csv.length;i++){const c=csv[i];if(c==='"'){if(quoted&&csv[i+1]==='"'){val+='"';i++}else quoted=!quoted}else if(c===","&&!quoted){fields.push(val);val=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&csv[i+1]==="\n")i++;fields.push(val);val="";if(fields.length>1)rows.push(fields);fields=[]}else val+=c}if(val||fields.length){fields.push(val);rows.push(fields)}const keys=rows.shift().map(k=>k.replace(/^\ufeff/,""));return rows.map(row=>Object.fromEntries(keys.map((k,i)=>[k,row[i]||""])));}
async function initData(){try{const response=await fetch("INI.CSV");if(!response.ok)throw Error(response.status);dataset=parseCSV(await response.text());loaded=true}catch(e){console.warn("INI catalog unavailable",e)}}
function prepareSearch(){const t=ui[lang],search=document.getElementById("query"),select=document.getElementById("sectionFilter");if(!loaded){document.getElementById("count").textContent=t.missing;return}const sections=[...new Set(dataset.map(x=>x.Section))].sort((a,b)=>a.localeCompare(b));select.innerHTML+=[...sections].map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>').join("");search.addEventListener("input",filter);select.addEventListener("change",filter);document.getElementById("more").addEventListener("click",()=>{shown+=40;drawResults()});filter()}
function filter(){const q=document.getElementById("query").value.toLocaleLowerCase(),section=document.getElementById("sectionFilter").value;filtered=dataset.filter(x=>(!section||x.Section===section)&&(!q||[x.Section,x.Name,x.Value,x.Description].some(y=>(y||"").toLowerCase().includes(q))));shown=40;drawResults()}
function drawResults(){const t=ui[lang];document.getElementById("count").textContent=filtered.length+" "+t.result;document.getElementById("results").innerHTML=filtered.slice(0,shown).map(x=>'<details class="result"><summary>'+escapeHtml(x.Name)+' <span class="pill">'+escapeHtml(x.Section)+'</span></summary><div class="metadata">'+escapeHtml(t.type)+': '+escapeHtml(x.Type)+' • '+escapeHtml(t.default)+': '+escapeHtml(x.Value)+'</div><p><strong>'+escapeHtml(t.technical)+':</strong> '+escapeHtml(x.Description)+'</p><p class="metadata"><strong>'+escapeHtml(t.source)+':</strong> '+escapeHtml(x.SourceFiles)+'</p><p class="metadata"><strong>'+escapeHtml(t.ini)+':</strong> '+escapeHtml(x.IniFiles)+'</p></details>').join("")||'<p>'+t.none+'</p>';document.getElementById("more").hidden=filtered.length<=shown}
document.getElementById("fr").onclick=()=>{lang="fr";localStorage.setItem("oslang",lang);render()};document.getElementById("en").onclick=()=>{lang="en";localStorage.setItem("oslang",lang);render()};document.getElementById("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("ostheme",document.body.classList.contains("dark")?"dark":"light")};if(localStorage.getItem("ostheme")==="dark")document.body.classList.add("dark");window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(names.includes(h)&&h!==current){current=h;render()}});initData().then(render);render();
</script></body></html>
